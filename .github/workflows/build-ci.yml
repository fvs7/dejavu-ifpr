name: CI Build & Test

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar Dependências
        run: dotnet restore ReaFreeze.sln

      - name: Compilar Solução (Release)
        run: dotnet build ReaFreeze.sln -c Release --no-restore

      - name: Executar Testes Unitários
        run: dotnet test tests/ReaFreeze.Tests/ReaFreeze.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publicar Executável Single-File (win-x64)
        run: >
          dotnet publish src/ReaFreeze.Cli/ReaFreeze.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/win-x64

      - name: Gerar Checksum SHA256
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 dist/win-x64/reafreeze.exe | Out-File -FilePath dist/win-x64/reafreeze.exe.sha256
          Get-Content dist/win-x64/reafreeze.exe.sha256

      - name: Publicar Artefato do Executável
        uses: actions/upload-artifact@v4
        with:
          name: reafreeze-win64
          path: |
            dist/win-x64/reafreeze.exe
            dist/win-x64/reafreeze.exe.sha256
            config/exclusions.default.json
